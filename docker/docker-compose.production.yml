services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-paperclip}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paperclip} -d ${POSTGRES_DB:-paperclip}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - /home/khoanguyen/kha/paperclip-pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: paperclip-local:production
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=512m
    ports:
      - "${PAPERCLIP_BIND_IP:-0.0.0.0}:${PAPERCLIP_PORT:-3100}:3100"
    env_file:
      - .env.production
    environment:
      HOST: 0.0.0.0
      PORT: "3100"
      NODE_ENV: production
      SERVE_UI: "true"
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_INSTANCE_ID: default
      PAPERCLIP_CONFIG: /paperclip/instances/default/config.json
      PAPERCLIP_MIGRATION_AUTO_APPLY: "true"
      HEARTBEAT_SCHEDULER_ENABLED: "true"
      PAPERCLIP_SECRETS_MASTER_KEY_FILE: /paperclip/secrets/master.key
    volumes:
      - /home/khoanguyen/kha/paperclip-home:/paperclip
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3100/api/health > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  paperclip-home:
  paperclip-pgdata:
